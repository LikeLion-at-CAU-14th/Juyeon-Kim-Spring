spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:ci-test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop

  sql:
    init:
      mode: never

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-dummy-client-id
            client-secret: test-dummy-client-secret
            scope:
              - email
              - profile
            redirect-uri: "http://localhost:8080/login/oauth2/code/google"

jwt:
  secret: test-only-dummy-jwt-secret-key-for-ci-do-not-use-in-production